<form id="invitationForm">

    <h2>Applicant Details</h2>

    <label>Full Name <span style="color:red">*</span></label>
    <input type="text" id="fullName" required>

    <label>Mobile Number <span style="color:red">*</span></label>
    <input type="text" id="mobile" required>

    <label>Email Address</label>
    <input type="email" id="email">

    <label>City / State</label>
    <input type="text" id="city">

    <h2>Programme Details</h2>

    <label>Occasion <span style="color:red">*</span></label>

    <select id="occasion">
        <option value="">Select</option>
        <option>Gruhapravesam</option>
        <option>Birthday</option>
        <option>Wedding</option>
        <option>Temple Festival</option>
        <option>Nama Sankeerthanam</option>
        <option>Other</option>
    </select>

    <div id="otherOccasionDiv" style="display:none;">
        <label>Please Specify Occasion</label>
        <input type="text" id="otherOccasion">
    </div>

    <label>Date <span style="color:red">*</span></label>
    <input type="date" id="eventDate">

    <label>Time <span style="color:red">*</span></label>
    <input type="time" id="eventTime">

    <label>Name of the Place / Temple / Residence <span style="color:red">*</span></label>
    <input type="text" id="venue">

    <label>Programme Venue Address <span style="color:red">*</span></label>
    <textarea rows="4" id="address"></textarea>
    
    <label>Landmark (Optional)</label>
    <input type="text" id="landmark">

    <label>Google Maps Link (Optional)</label>
    <input type="text" id="maps">

    <button type="button" id="generateLetter">
        Generate Request Letter
    </button>

</form>

<div id="letterPreview" style="display:none; margin-top:40px;">

    <h2>Request Letter Preview</h2>

    <div id="generatedLetter"></div>

    <button type="button" id="submitRequest" style="display:none;">
        Submit Request
    </button>

</div>
