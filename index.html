<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhajana Programme Invitation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Bhajana Programme Invitation</h1>

    <p class="subtitle">
        Request Maha Manthra Bhajana Mandali to conduct Bhajana &
        Nama Sankeerthanam at your place.
    </p>

    <form>

        <h2>Applicant Details</h2>

        <label>Full Name</label>
        <input type="text">

        <label>Mobile Number</label>
        <input type="text">

        <label>Email Address</label>
        <input type="email">

        <label>City / State</label>
        <input type="text">

        <h2>Programme Details</h2>

        <label>Occasion</label>

        <select>
            <option>Select</option>
            <option>Gruhapravesam</option>
            <option>Birthday</option>
            <option>Wedding</option>
            <option>Temple Festival</option>
            <option>Nama Sankeerthanam</option>
            <option>Other</option>
        </select>

        <label>Date</label>
        <input type="date">

        <label>Time</label>
        <input type="time">

        <label>Venue Name</label>
        <input type="text">

        <label>Full Address</label>
        <textarea rows="4"></textarea>

        <label>Landmark (Optional)</label>
        <input type="text">

        <label>Google Maps Link (Optional)</label>
        <input type="text">

        <button type="button">
            Generate Request Letter
        </button>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
